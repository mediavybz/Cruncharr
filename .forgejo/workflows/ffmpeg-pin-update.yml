name: FFmpeg pin update

# BtbN prunes dated ffmpeg autobuild releases after a few weeks; a stale pin
# 404s and breaks every image build (Aug 2026 incident). This job runs weekly
# from the default branch and rotates the pin on both build branches, with
# freshly verified SHA256 checksums.
#
# A rotated pin is validated with a full cache-only build BEFORE it is
# committed, so a broken upstream build can never land on a branch. (The
# commit is pushed with the Actions token, and Forgejo does not trigger
# on.push workflows for Actions-token pushes, so the in-job validation is
# also the only validation this rotation gets.)
#
# testing receives the rotation directly: it is the validation channel and
# the published testing image is smoke-tested before anyone depends on it.
# master is the stable channel, so its rotation is pushed to the
# ci/ffmpeg-pin-master branch and opened as a pull request for a human to
# merge; the checksum is computed from the same download it pins, so a
# compromised upstream build must never reach master without review.

on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Rotate even if the current pin is young
        required: false
        default: false
        type: boolean

concurrency:
  group: cruncharr-ffmpeg-pin
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotate pinned BtbN ffmpeg autobuild
    runs-on: docker-build
    timeout-minutes: 150
    permissions:
      contents: write
      pull-requests: write
    env:
      FORCE_INPUT: ${{ inputs.force }}
    steps:
      - name: Check out the testing branch
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: testing
          persist-credentials: true

      - name: Rotate testing pin
        run: |
          set -euo pipefail
          force_flag=''
          case "$FORCE_INPUT" in
            true|True) force_flag='--force' ;;
          esac
          bash scripts/update-ffmpeg-pin.sh --apply $force_flag
          if git diff --quiet Dockerfile; then
            echo "testing pin already current"
          else
            echo "Validating rotated pin with a full cache-only build ..."
            bash scripts/publish-docker.sh
            git config user.name "Cruncharr Deploy"
            git config user.email "deploy@cruncharr.local"
            git commit -am "build(docker): rotate pinned BtbN ffmpeg autobuild"
            git push
          fi

      - name: Check out the master branch
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: master
          persist-credentials: true

      - name: Rotate master pin on a review branch
        env:
          PIN_BRANCH: ci/ffmpeg-pin-master
          API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          force_flag=''
          case "$FORCE_INPUT" in
            true|True) force_flag='--force' ;;
          esac
          bash scripts/update-ffmpeg-pin.sh --apply $force_flag
          if git diff --quiet Dockerfile; then
            echo "master pin already current"
            exit 0
          fi
          echo "Validating rotated pin with a full cache-only build ..."
          bash scripts/publish-docker.sh
          release=$(sed -n 's/^ARG FFMPEG_RELEASE=//p' Dockerfile | head -1 | tr -d '[:space:]')
          git config user.name "Cruncharr Deploy"
          git config user.email "deploy@cruncharr.local"
          git checkout -B "$PIN_BRANCH"
          git commit -am "build(docker): rotate pinned BtbN ffmpeg autobuild"
          git push --force origin "$PIN_BRANCH"

          # Open the pull request unless one from this branch is already waiting.
          api="${GITHUB_API_URL:-${GITHUB_SERVER_URL}/api/v1}/repos/${GITHUB_REPOSITORY}"
          open_prs=$(curl -fsSL -H "Authorization: token ${API_TOKEN}" "${api}/pulls?state=open&limit=50")
          if printf '%s' "$open_prs" | grep -q "\"ref\": *\"${PIN_BRANCH}\""; then
            echo "A pull request for ${PIN_BRANCH} is already open; updated its branch."
            exit 0
          fi
          body="Automated BtbN ffmpeg pin rotation to ${release}. The Dockerfile was validated with a full cache-only build for both architectures before this branch was pushed. Review and merge to keep stable image builds working before the previous release is pruned upstream."
          payload=$(printf '{"title":"build(docker): rotate pinned BtbN ffmpeg autobuild to %s","head":"%s","base":"master","body":"%s"}' "$release" "$PIN_BRANCH" "$body")
          curl -fsSL -X POST -H "Authorization: token ${API_TOKEN}" -H "Content-Type: application/json" \
            -d "$payload" "${api}/pulls" >/dev/null
          echo "Opened a pull request for ${PIN_BRANCH}"
