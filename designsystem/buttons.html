<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cruncharr — Buttons</title>
<style>
  :root{
    --accent:#F47521; --accent-bright:#ff9145; --accent-soft:rgba(244,117,33,.15);
    --bg-primary:#0a0a0a; --bg-tertiary:#161618; --bg-hover:#1f1f23;
    --border-color:rgba(255,255,255,.08);
    --text-primary:#f5f6f8; --text-secondary:#bcc0ca;
    --radius:14px; --shadow-glow:0 8px 30px rgba(244,117,33,.30);
    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-sans);padding:32px}
  h1{font-weight:800;font-size:1.4rem;margin:0 0 4px}
  .sub{color:#898e98;margin:0 0 24px}
  h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-secondary);margin:22px 0 12px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .btn{font-family:inherit;font-weight:600;font-size:.9rem;border-radius:var(--radius);padding:10px 18px;cursor:pointer;border:1px solid transparent;transition:all .2s cubic-bezier(.22,1,.36,1)}
  .btn.primary{background:var(--accent);color:#160a02;box-shadow:var(--shadow-glow)}
  .btn.primary:hover{background:var(--accent-bright)}
  .btn.secondary{background:var(--bg-tertiary);color:var(--text-primary);border-color:var(--border-color)}
  .btn.secondary:hover{background:var(--bg-hover)}
  .btn.ghost{background:transparent;color:var(--text-secondary);border-color:var(--border-color)}
  .btn.ghost:hover{color:var(--text-primary);background:var(--bg-hover)}
  .btn.danger{background:transparent;color:#ff5a63;border-color:rgba(255,90,99,.4)}
  .btn.danger:hover{background:rgba(255,90,99,.12)}
  .btn.sm{padding:6px 12px;font-size:.8rem}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .icon{display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center;border-radius:10px;background:var(--bg-tertiary);border:1px solid var(--border-color);color:var(--text-secondary);cursor:pointer}
</style>
</head>
<body>
  <h1>Buttons</h1>
  <p class="sub">Primary actions carry the orange glow; everything else stays quiet on the dark surface.</p>

  <h2>Variants</h2>
  <div class="row">
    <button class="btn primary">Save Settings</button>
    <button class="btn secondary">Reset Tab to Default</button>
    <button class="btn ghost">Cancel</button>
    <button class="btn danger">Reset ALL Settings</button>
    <button class="btn primary" disabled>Disabled</button>
  </div>

  <h2>Sizes</h2>
  <div class="row">
    <button class="btn primary">Default</button>
    <button class="btn primary sm">Small</button>
    <button class="btn secondary sm">Pause All</button>
  </div>

  <h2>Icon buttons</h2>
  <div class="row">
    <span class="icon">▶</span>
    <span class="icon">⏸</span>
    <span class="icon">↻</span>
    <span class="icon">⋯</span>
  </div>
</body>
</html>
