<!-- @dsCard group="Forms" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cruncharr — Forms</title>
<style>
  :root{
    --accent:#F47521; --accent-soft:rgba(244,117,33,.15);
    --bg-primary:#0a0a0a; --bg-card:#141416; --bg-tertiary:#161618;
    --border-color:rgba(255,255,255,.08);
    --text-primary:#f5f6f8; --text-secondary:#bcc0ca; --text-muted:#898e98;
    --radius-sm:10px; --radius-md:14px;
    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-sans);padding:32px}
  h1{font-weight:800;font-size:1.4rem;margin:0 0 4px}
  .sub{color:var(--text-muted);margin:0 0 24px}
  .panel{max-width:640px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);overflow:hidden}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--bg-tertiary);border-bottom:1px solid var(--border-color)}
  .panel-head b{font-size:.95rem}
  .panel-head span{font-size:.78rem;color:var(--text-muted)}
  .field{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid var(--border-color)}
  .field:last-child{border-bottom:none}
  .field .label b{display:block;font-size:.9rem}
  .field .label span{display:block;font-size:.78rem;color:var(--text-muted);margin-top:2px}
  /* toggle */
  .toggle{width:42px;height:24px;border-radius:999px;background:var(--bg-tertiary);border:1px solid var(--border-color);position:relative;flex:0 0 auto;cursor:pointer}
  .toggle i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text-muted);transition:.2s}
  .toggle.on{background:var(--accent-soft);border-color:var(--accent)}
  .toggle.on i{left:20px;background:var(--accent)}
  /* select + input */
  select,input{font-family:inherit;font-size:.88rem;color:var(--text-primary);background:var(--bg-tertiary);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:9px 12px;min-width:200px}
  select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
</style>
</head>
<body>
  <h1>Form controls</h1>
  <p class="sub">A settings panel: a titled header, then rows of label + control. Toggles, selects and inputs share one focus ring.</p>

  <div class="panel">
    <div class="panel-head"><b>Muxing Settings</b><span>Output and muxing options</span></div>
    <div class="field">
      <div class="label"><b>Skip Muxing</b><span>Leave tracks unmerged</span></div>
      <div class="toggle"><i></i></div>
    </div>
    <div class="field">
      <div class="label"><b>Mux to MP4</b><span>Otherwise Matroska (.mkv)</span></div>
      <div class="toggle on"><i></i></div>
    </div>
    <div class="field">
      <div class="label"><b>Default Audio</b></div>
      <select><option>Japanese</option><option>English</option></select>
    </div>
    <div class="field">
      <div class="label"><b>Default Subtitle</b></div>
      <select><option>English</option><option>Japanese</option></select>
    </div>
    <div class="field">
      <div class="label"><b>File title</b></div>
      <input placeholder="{seriesTitle} - S{season}E{episode}">
    </div>
  </div>
</body>
</html>
