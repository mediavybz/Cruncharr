<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cruncharr — Tabs</title>
<style>
  :root{
    --accent:#F47521; --accent-soft:rgba(244,117,33,.15);
    --bg:#0a0a0a; --bg-tertiary:#161618; --border:rgba(255,255,255,.08);
    --text:#f5f6f8; --text-2:#bcc0ca; --text-3:#898e98;
    --radius-full:999px; --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);padding:32px}
  h1{font-weight:800;font-size:1.4rem;margin:0 0 4px}
  .sub{color:var(--text-3);margin:0 0 24px;max-width:600px}
  h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-2);margin:26px 0 12px}
  /* pill tabs (Seasonal) */
  .pill-tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pill-tab{padding:8px 20px;border:1px solid var(--border);background:var(--bg-tertiary);color:var(--text-2);border-radius:var(--radius-full);font-weight:600;font-size:.9rem;cursor:pointer}
  .pill-tab.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  /* underline tabs grouped by category (Settings) */
  .cat{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .cat-label{min-width:104px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
  .utab{padding:10px 18px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-2);font-weight:600;font-size:.88rem;cursor:pointer}
  .utab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .group{border-bottom:1px solid var(--border);padding-bottom:6px}
</style>
</head>
<body>
  <h1>Tabs</h1>
  <p class="sub">Two tab idioms. <b>Pill tabs</b> for content switching (Seasonal: Winter/Spring/Summer/Fall). <b>Underline tabs grouped by labeled category</b> for Settings (Application vs Crunchyroll), so it's clear what each tab affects.</p>

  <h2>Pill tabs — Seasonal</h2>
  <div class="pill-tabs">
    <button class="pill-tab">Winter</button>
    <button class="pill-tab">Spring</button>
    <button class="pill-tab active">Summer</button>
    <button class="pill-tab">Fall</button>
  </div>

  <h2>Category tabs — Settings</h2>
  <div class="group">
    <div class="cat">
      <span class="cat-label">Application</span>
      <button class="utab active">General</button>
      <button class="utab">Download</button>
      <button class="utab">Queue</button>
      <button class="utab">History</button>
      <button class="utab">Sonarr</button>
      <button class="utab">Notifications</button>
      <button class="utab">Proxy</button>
      <button class="utab">Appearance</button>
    </div>
    <div class="cat">
      <span class="cat-label">Crunchyroll</span>
      <button class="utab">Account &amp; Languages</button>
      <button class="utab">Filename</button>
      <button class="utab">Muxing</button>
      <button class="utab">Calendar</button>
    </div>
  </div>
</body>
</html>
