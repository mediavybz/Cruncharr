version: '3.8'

services:
  cruncharr:
    build: .
    image: cruncharr:latest
    container_name: cruncharr
    restart: unless-stopped
    ports:
      - "8585:8585"
    volumes:
      # USER-FACING DIRECTORIES (mounted from host):
      
      # Configuration - stores cruncharr.yaml, history.json, queue.json, token, logs
      - ./config:/config
      
      # Downloads - where completed files go
      - ./downloads:/downloads
      
      # Widevine DRM files (REQUIRED for DRM content)
      # Place device_client_id_blob.bin and device_private_key.pem here
      - ./widevine:/widevine
      
      # Tools - custom tools or ffmpeg overrides (optional)
      # - ./tools:/tools
      
      # Optional: Mount your media library if *arr apps manage it
      # - /path/to/media:/media
      
      # INTERNAL DIRECTORIES (stay inside container, not mounted):
      # /tmp/cruncharr - temporary processing files
      # /app/presets - built-in ffmpeg presets (included in image)
      # /app/fonts - built-in subtitle fonts (included in image)
      # /app/video - internal workspace

    # GPU passthrough for hardware-accelerated sync (Intel/AMD via VAAPI/QSV).
    # Uncomment to expose the render node so it appears in Settings -> Sync HW Accel.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:            # match the host 'render'/'video' group so the device is writable
    #   - "video"
    #   - "render"
    environment:
      # User/group the app runs as. Set these to match the owner of ./config and
      # ./downloads on the host (run `id` to find yours) so the container can write
      # settings and download files. Defaults to 1000:1000.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}

      # Crunchyroll credentials (optional - can also be in config file)
      - CRUNCHYROLL_EMAIL=${CRUNCHYROLL_EMAIL:-}
      - CRUNCHYROLL_PASSWORD=${CRUNCHYROLL_PASSWORD:-}
      
      # Output configuration
      - CRUNCHYROLL_OUTPUT_DIR=/downloads
      - CRUNCHYROLL_TEMP_DIR=/tmp/cruncharr
      
      # Queue configuration (optional - can also be set in config file)
      # - CRUNCHYROLL_QUEUE_PERSIST=true
      # - CRUNCHYROLL_QUEUE_AUTO_DOWNLOAD=true
      
      # Webhook for notifications (optional)
      - CRUNCHYROLL_WEBHOOK_URL=${CRUNCHYROLL_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8585/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Sonarr integration example
  # sonarr:
  #   image: lscr.io/linuxserver/sonarr:latest
  #   container_name: sonarr
  #   restart: unless-stopped
  #   ports:
  #     - "8989:8989"
  #   volumes:
  #     - ./sonarr/config:/config
