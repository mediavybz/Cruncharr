services:
  cruncharr:
    build: .
    image: cruncharr:latest
    container_name: cruncharr
    restart: unless-stopped
    # Prevents any process in the container from gaining privileges (setuid binaries
    # etc.). gosu drops privileges with plain syscalls, so startup is unaffected.
    security_opt:
      - no-new-privileges:true
    # Optional further hardening, all verified against the entrypoint's needs:
    # cap_drop: [ALL]
    # cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    ports:
      # Bind to 127.0.0.1:8585:8585 instead when a reverse proxy sits in front.
      - "8585:8585"
    volumes:
      # USER-FACING DIRECTORIES (mounted from host):
      
      # Configuration - stores cruncharr.yaml, history.json, queue.json, token, logs
      - ./config:/config
      
      # Downloads - where completed files go
      - ./downloads:/downloads
      
      # Widevine DRM files (REQUIRED for DRM content)
      # Place device_client_id_blob.bin and device_private_key.pem here
      - ./widevine:/widevine
      
      # Tools - custom tools or ffmpeg overrides (optional)
      # - ./tools:/tools
      
      # Optional: Mount your media library if *arr apps manage it
      # - /path/to/media:/media
      
      # INTERNAL DIRECTORIES (stay inside container, not mounted):
      # /tmp/cruncharr - temporary processing files
      # /app/fonts - custom subtitle fonts (mount to add your own)

    # GPU passthrough for hardware-accelerated sync (Intel/AMD via VAAPI/QSV).
    # Uncomment to expose the render node so it appears in Settings -> Sync HW Accel.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:            # match the host 'render'/'video' group so the device is writable
    #   - "video"
    #   - "render"
    environment:
      # User/group the app runs as. Set these to match the owner of ./config and
      # ./downloads on the host (run `id` to find yours) so the container can write
      # settings and download files. Defaults to 1000:1000.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Group-writable files/directories (0664/0775) so Sonarr can rename/import
      # when it shares PGID with Cruncharr but runs under a different PUID.
      - UMASK=${UMASK:-002}

      # Recommended when anything beyond your own LAN can reach port 8585:
      # every /api request must then carry the key (X-Api-Key header).
      # - CRUNCHARR_API_KEY=${CRUNCHARR_API_KEY:-}
      # Host names/IPs the server answers to; blocks DNS-rebinding from other sites.
      # - AllowedHosts=192.168.1.10;cruncharr.lan;localhost

      # Crunchyroll credentials (optional - can also be in config file; the file is
      # mode 600 while environment variables are visible to every process)
      - CRUNCHYROLL_EMAIL=${CRUNCHYROLL_EMAIL:-}
      - CRUNCHYROLL_PASSWORD=${CRUNCHYROLL_PASSWORD:-}
      
      # Output configuration
      - CRUNCHYROLL_OUTPUT_DIR=/downloads
      - CRUNCHYROLL_TEMP_DIR=/tmp/cruncharr
      
      # Queue configuration (optional - can also be set in config file)
      # - CRUNCHYROLL_QUEUE_PERSIST=true
      # - CRUNCHYROLL_QUEUE_AUTO_DOWNLOAD=true
      
      # Webhook for notifications (optional)
      - CRUNCHYROLL_WEBHOOK_URL=${CRUNCHYROLL_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "grep", "-q", ":2189 ", "/proc/net/tcp", "/proc/net/tcp6"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Optional: Sonarr integration example
  # sonarr:
  #   image: lscr.io/linuxserver/sonarr:latest
  #   container_name: sonarr
  #   restart: unless-stopped
  #   ports:
  #     - "8989:8989"
  #   volumes:
  #     - ./sonarr/config:/config
  #     - ./downloads:/downloads
  #     - /path/to/anime:/tv
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #   depends_on:
  #     - cruncharr

  # Optional: Radarr integration example
  # radarr:
  #   image: lscr.io/linuxserver/radarr:latest
  #   container_name: radarr
  #   restart: unless-stopped
  #   ports:
  #     - "7878:7878"
  #   volumes:
  #     - ./radarr/config:/config
  #     - ./downloads:/downloads
  #     - /path/to/movies:/movies
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #   depends_on:
  #     - cruncharr
