<!DOCTYPE html>
<!--
================================================================================
CRUNCHARR WEB UI - PORTED FROM CRUNCHY-DOWNLOADER
================================================================================

PORTING GUIDE:
This file is a manual port of the Crunchy-Downloader desktop UI (Avalonia/FluentAvalonia)
to a web-based single-page application. When updating from new versions of the original
app, use this mapping to find what needs to be updated:

ORIGINAL FILE ? WEB UI SECTION:
- MainWindow.axaml ? Navigation sidebar layout (lines ~860-920)
- DownloadsPageView.axaml ? renderDownloads() function
- AddDownloadPageView.axaml ? renderAddDownload() function  
- CalendarPageView.axaml ? renderCalendar() function
- SeriesPageView.axaml ? renderSeries() / renderSeasons() functions
- HistoryPageView.axaml ? renderHistory() function
- AccountPageView.axaml ? renderAccount() function
- SettingsPageView.axaml ? renderSettings() function
- ToastNotification.axaml ? showToast() function

COLOR SCHEME:
Uses WinUI 3 / Fluent Design System dark theme colors (ported from FluentAvalonia):
- ApplicationPageBackgroundThemeBrush ? --bg-primary (#202020)
- ControlAltFillColorQuarternary ? --bg-secondary (#2c2c2c)
- ComboBoxDropDownBackground ? --bg-card (#1e1e1e)
- TextFillColorPrimaryBrush ? --text-primary (#ffffff)
- TextFillColorSecondaryBrush ? --text-secondary (#a0a0a0)
- SystemAccentColor ? --accent-blue (#4cc2ff)
- Crunchyroll brand color kept as --accent-orange (#f47521)

ICONS:
Original uses Fluent System Icons (SymbolIcon). We use inline SVGs matching the
same icon shapes: Download, Add, Calendar, Clock, Library, Contact, Settings.

DATA MODEL MAPPING:
Original ViewModels ? API endpoints:
- DownloadsPageViewModel ? GET/POST /api/v1/queue
- AddDownloadPageViewModel ? GET /api/v1/series/search, GET /api/v1/series/{id}/episodes
- CalendarPageViewModel ? GET /api/v1/calendar
- HistoryPageViewModel ? GET /api/v1/history
- AccountPageViewModel ? GET/POST /api/v1/auth/*
- SettingsPageViewModel ? GET/POST /api/v1/config

MAINTENANCE NOTES:
- This is a manual port - future updates to Crunchy-Downloader require manual syncing
- Keep API response shapes similar to original ViewModels to minimize UI changes
- When original adds new features, check the corresponding ViewModel and View files
- Update this comment block with any new mappings
================================================================================
-->
