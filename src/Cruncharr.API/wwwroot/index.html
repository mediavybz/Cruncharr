        async function toggleSetting(key, value) {
            console.log('Toggle', key, value);
            
            let updateData = {};
            
            if (key === 'removeFinished') {
                updateData = { general: { removeFinishedDownload: value } };
            } else if (key === 'autoDownload') {
                updateData = { queue: { autoDownload: value } };
            }
            
            try {
                const res = await fetch('/api/v1/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });
                if (res.ok) {
                    showToast(`${key === 'removeFinished' ? 'Remove Finished' : 'Auto Download'} ${value ? 'enabled' : 'disabled'}`, 'success');
                    // Update local config cache
                    if (key === 'removeFinished') {
                        config.general = config.general || {};
                        config.general.removeFinishedDownload = value;
                    } else if (key === 'autoDownload') {
                        config.queue = config.queue || {};
                        config.queue.autoDownload = value;
                    }
                } else {

        function refreshHistory() { fetchHistoryData(); }
        async function addMissingToQueue() {
            try {
                // Fetch rich history to find series with missing episodes
                const res = await fetch('/api/v1/history/rich');
                const data = await res.json();
                let added = 0;
                
                // Iterate through history and add missing episodes
                for (const series of (data || [])) {
                    for (const season of (series.seasons || [])) {
                        for (const episode of (season.episodes || [])) {
                            if (!episode.isDownloaded && episode.episodeId) {
                                await fetch('/api/v1/queue', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        episodeId: episode.episodeId,
                                        title: episode.title || 'Unknown',
                                        seriesTitle: series.title || 'Unknown',
                                        seasonNumber: season.seasonNumber || 1,
                                        episodeNumber: episode.episodeNumber || 1
                                    })
                                });
                                added++;
                            }
                        }
                    }
                }
                
                if (added > 0) {
                    showToast(`Added ${added} missing episode(s) to queue`, 'success');
                } else {
                    showToast('No missing episodes found', 'info');
                }
            } catch (e) {
                showToast('Failed to add missing episodes', 'error');
            }
        }

        function sortHistoryBy(field) {
            if (!historyData) return;
            historyData.sort((a, b) => {
                if (field === 'title') return (a.seriesTitle || '').localeCompare(b.seriesTitle || '');
                if (field === 'date') return (b.lastUpdated || '').localeCompare(a.lastUpdated || '');
                if (field === 'status') return (a.downloadStatus || '').localeCompare(b.downloadStatus || '');
                return 0;
            });
            renderHistoryContent();
            showToast(`Sorted by ${field}`, 'success');
        }

        function getStatusBadge(state) {
            const badges = {
                'queued': '<span class="badge badge-queued">Queued</span>',
                'downloading': '<span class="badge badge-downloading">Downloading</span>',
                'processing': '<span class="badge badge-downloading">Processing</span>',
                'done': '<span class="badge badge-done">Done</span>',
                'error': '<span class="badge badge-error">Error</span>',
                'paused': '<span class="badge badge-retry">Paused</span>'
            };
            return badges[state?.toLowerCase()] || `<span class="badge badge-queued">${state}</span>`;
        }

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatDownloadSpeed(bytesPerSec) {
            if (!bytesPerSec || bytesPerSec === 0) return '';
            // Use MB/s format (matching qma default DownloadSpeedInBits=false)
            return (bytesPerSec / 1000000.0).toFixed(2) + ' MB/s';
        }

        function formatETA(seconds) {
            if (!seconds || seconds <= 0) return '';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `ETA: ${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            return `ETA: ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function getDoingText(progress) {
            if (!progress) return 'Queued';
            // Handle waiting for retry
            if (progress.retryAtUtc && new Date(progress.retryAtUtc) > new Date()) {
                const retryTime = new Date(progress.retryAtUtc).toLocaleTimeString();
                return `Rate limited, retrying at ${retryTime}`;
            }
            // Use doing if not empty, otherwise derive from state
            if (progress.doing && progress.doing.trim().length > 0) {
                return progress.doing;
            }
            const state = (progress.state || 'queued').toLowerCase();
            if (state === 'downloading') return 'Downloading...';
            if (state === 'processing') return 'Processing...';
            if (state === 'done') return 'Complete';
            if (state === 'error') return 'Error';
            if (state === 'paused') return 'Paused';
            if (state === 'cancelled') return 'Cancelled';
            return 'Queued';
        }

        let eventSource = null;
        
        function startPolling() {
            // Check auth status periodically
            checkAuthStatus();
            setInterval(checkAuthStatus, 30000);
            
            // Use SSE for real-time queue updates instead of polling
            startQueueSSE();
            
            // Keep polling history (no SSE for history yet)
            setInterval(() => {
                if (currentPage === 'history') fetchHistoryData();
            }, 5000);
        }
        
        function startQueueSSE() {
            if (eventSource) {
                eventSource.close();
            }
            
            eventSource = new EventSource('/api/v1/queue/sse');
            
            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    updateQueueData(data.items || []);
                } catch (e) {
                    console.error('Failed to parse SSE data:', e);
                }
            };
            
            eventSource.onerror = (error) => {
                console.error('SSE connection error:', error);
                // Reconnect after 3 seconds
                setTimeout(() => {
                    if (eventSource && eventSource.readyState === EventSource.CLOSED) {
                        startQueueSSE();
                    }
                }, 3000);
            };
            
            eventSource.onopen = () => {
                console.log('SSE connection established');
            };
        }
        
        let lastAuthWarning = 0;
        async function checkAuthStatus() {
            try {
                const res = await fetch('/api/v1/auth/status');
                const status = await res.json();
                authStatus = status;
                
                const now = Date.now();
                if (!status.isAuthenticated) {
                    if (now - lastAuthWarning > 60000) { // Warn every 60 seconds
                        lastAuthWarning = now;
                        showToast('You are not logged in. Please go to Account tab to log in.', 'warning');
                    }
                } else if (!status.hasPremium) {
                    // Check if there are premium items in queue
                    const hasPremiumItems = queueData.some(i => i.episode?.isPremium);
                    if (hasPremiumItems && now - lastAuthWarning > 60000) {
                        lastAuthWarning = now;
                        showToast('No premium subscription detected. Premium content will fail to download.', 'warning');
                    }
                }
            } catch (e) {
                console.error('Failed to check auth status:', e);
            }
        }
